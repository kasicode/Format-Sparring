text."},{"t":"Formula E: Unplugged","y":"2020–present","te":"International","p":"Various / streaming","g":"Sports Documentary","s":"Behind-the-scenes access documentary series following the Formula E electric racing championship — offering intimate access to drivers, teams and the unique world of street-circuit electric motorsport as the sport grew from fringe concept to global championship."},{"t":"Take Us Home: Leeds United","y":"2019","te":"UK","p":"Amazon Prime Video","g":"Sports Documentary","s":"Amazon Prime Video access documentary following Leeds United Football Club through their 2018-19 Championship season under coach Marcelo Bielsa — an intense, warmly received sports documentary capturing one of English football's most passionate clubs at a pivotal moment."},{"t":"Face Off (SyFy)","y":"2011–2018","te":"USA","p":"Syfy","g":"Craft Competition","s":"Special-effects makeup competition on Syfy in which prosthetics and creature artists created character designs for weekly themed challenges and elimination judging — eight seasons celebrating specialist craft and fantasy artistry."},{"t":"Restaurant: Impossible","y":"2011–present","te":"USA","p":"Food Network","g":"Business Reality","s":"Food Network series in which chef Robert Irvine arrives at a failing restaurant with a limited budget and 48 hours to overhaul the food, décor and management — a fast-paced, high-drama business rescue format built on culinary expertise and operational diagnosis."},{"t":"Buddy vs. Duff","y":"2019–2021","te":"USA","p":"Food Network","g":"Craft Competition","s":"Food Network competition pitting cake artists Buddy Valastro (Cake Boss) and Duff Goldman against each other in head-to-head elaborate cake challenges — a celebrity craft format built on the rivalry of two of America's most famous bakers."},{"t":"MXC","y":"2003–2007","te":"USA","p":"Spike TV","g":"Variety Reality","s":"American comedy re-dubbed version of the Japanese variety format Takeshi's Castle — the original footage was overdubbed with absurdist English commentary turning it into a cult hit on Spike TV. One of the earliest examples of a Japanese format being reimagined for a Western audience."},{"t":"Airline (ITV)","y":"2004–2006","te":"UK","p":"ITV","g":"Occupational Reality","s":"ITV observational series following staff and passengers at Britannia Airways — a workplace docu-soap capturing the stress, humour and conflict of a major UK airline during the era of package holidays."},{"t":"Airports 24/7: Britain","y":"2014–2015","te":"UK","p":"ITV2 / ITV","g":"Occupational Reality","s":"ITV documentary series giving round-the-clock access to the operations of British airports — following staff and passengers through security, check-in and the full behind-the-scenes machinery of modern air travel."},{"t":"Bondi Rescue","y":"2006–present","te":"Australia","p":"Network Ten","g":"Emergency / Medical Reality","s":"Long-running Australian docu-reality series following the professional lifeguards who patrol Bondi Beach in Sydney — one of Australia's most-watched and internationally sold factual entertainment formats, exported to broadcasters worldwide."},{"t":"Mary Portas: Secret Shopper","y":"2011–2012","te":"UK","p":"Channel 4","g":"Consumer Affairs Reality","s":"Channel 4 series in which retail expert Mary Portas went undercover as a customer to expose poor service and help businesses improve their customer experience — a consumer-affairs intervention format combining undercover investigation with practical business advice."},{"t":"Rich House, Poor House","y":"2017–present","te":"UK","p":"Channel 5","g":"Lifestyle Swap","s":"Channel 5 social experiment format in which a wealthy family and a low-income family swap homes and budgets for a week — revealing the realities of life across Britain's economic divide and prompting reflection on inequality, values and quality of life."},{"t":"Isis Fashion Awards","y":"2025–","te":"Netherlands","p":"Dutch TV / Streaming","g":"Fashion Competition","s":"Dutch fashion competition series following an international accessory design competition staged in the Netherlands — designers showcase original accessories on the catwalk in front of a live audience and professional jury."},{"t":"Ticket to the Tribes","y":"2026–","te":"Netherlands","p":"Dutch TV","g":"Reality Adventure","s":"Dutch reality adventure series in which participants travel to meet and live with remote tribes around the world — a cultural immersion travel format."},{"t":"A.S.S. - Anti Survival Show","y":"2026–","te":"Netherlands","p":"Dutch TV","g":"Reality Competition","s":"Twelve Dutch reality stars are dropped on a deserted beach and must complete challenges to get progressively closer to a luxury yacht anchored offshore. Only one reality star earns a place on board — a last-person-standing elimination format with a deliberately anti-prestige premise."},{"t":"Get the F*ck Out of My House","y":"2016","te":"Netherlands","p":"Dutch TV","g":"Social Experiment","s":"Dutch social experiment in which 100 contestants are placed in a house designed for only four people. They must survive the overcrowding, scarcity and social pressure to be the last person standing and win the remaining household prize pot of €100,000."},{"t":"Heels in the Hay","y":"2025–","te":"Netherlands","p":"Dutch TV","g":"Reality Competition","s":"Twelve Dutch city influencers swap their filtered urban lives for the unglamorous reality of the Dutch countryside — early mornings, physical labour and dirty hands. A fish-out-of-water elimination format pitting Instagram culture against agricultural reality."},{"t":"Million Dollar Listing Nederland","y":"2026–","te":"Netherlands","p":"Dutch TV","g":"Reality / Property","s":"Dutch adaptation of the Million Dollar Listing format — following four top real estate agents competing in the Dutch luxury housing market, with access to high-stakes deals, interpersonal drama and lavish lifestyles."},{"t":"Love Island: Aftersun (NL/BE)","y":"2020–","t arch of definitive evidence of the paranormal."},{"t":"De Grannies van Amsterdam","y":"2025–","te":"Netherlands","p":"Dutch TV","g":"Factual / Documentary","s":"Dutch observational docu-reality following five widowed women from Amsterdam-Zuid, all around 70 years old, who share a deep bond of friendship — exploring themes of late-life love, friendship and the joy of ageing with humour and vitality."},{"t":"Kees van der Spek: Oplichters Aangepakt!","y":"2019–","te":"Netherlands","p":"RTL 4","g":"Consumer Affairs Reality","s":"Dutch investigative reality series — the rebranded continuation of Kees van der Spek Ontmaskert — in which journalist Kees van der Spek uses hidden cameras globally to expose scammers, fraudsters and criminal operations, with a focus on protecting Dutch victims."},{"t":"The Masked Singer (Netherlands)","y":"2019–","te":"Netherlands","p":"RTL 4","g":"Talent Competition","s":"Dutch adaptation of the global Masked Singer format: celebrities perform in elaborate anonymous costumes while a panel of judges and the public at home try to guess their identities. One unmasked per episode until a winner is crowned. Part of the global franchise that originated in South Korea."},{"t":"Down the Road","y":"2022–","te":"Netherlands","p":"NPO / BNNVARA","g":"Factual / Documentary","s":"Dutch documentary travel series in which presenter Gordon takes seven young people with Down's syndrome on a road trip across the Netherlands — a warm, boundary-shifting journey that builds friendships and challenges assumptions about people with intellectual disabilities."},{"t":"Paradise Hotel BE/NL","y":"2005–","te":"Netherlands / Belgium","p":"Veronica (NL) / VT4 (BE)","g":"Reality Dating","s":"Benelux adaptation of the international Paradise Hotel format: singles check into a resort hotel, couple up for shared rooms, and face elimination — with new arrivals constantly disrupting existing pairings. Filmed at the same Mexican resort used for the original US series."},{"t":"3 op xperiment: 15 participants live permanently in a self-contained monitored area while being observed continuously by cameras — attempting to build a functioning community from scratch under 24/7 public scrutiny."},{"t":"The Real Housewives Ultimate Girls Trip: Benelux","y":"2026–","te":"Netherlands / Belgium","p":"Hayu / NBCUniversal","g":"Celebrity Reality / Docu-soap","s":"Benelux crossover spin-off in which iconic Real Housewives cast members from the Netherlands and Belgium unite on a shared luxury holiday — combining the drama, friendships and rivalries of the regional Real Housewives franchises into a single event series."},{"t":"Maestro (Netherlands)","y":"2012–","te":"Netherlands","p":"NPO / KRO","g":"Celebrity Reality","s":"Dutch adaptation of the Maestro format in which celebrities with no conducting experience are trained by professional conductors and must perform in front of a live orchestra and audience — judged on musical interpretation, stage presence and technique."},{"t":"Geer & Goor: Zoeken een hobby!","y":"2016","te":"Netherlands","p":"RTL","g":"Celebrity Reality","s":"Dutch celebrity mini-series following Gerard Joling and Gordon — two flamboyant Dutch entertainment figures — as they earnestly try out a series of new hobbies together, generating comedy from the clash between their extravagant personalities and ordinary pastimes."},{"t":"Louisa & Rosanna: Onze Transgender Liefde","y":"2015–2019","te":"Netherlands","p":"Dutch TV","g":"Factual / Documentary","s":"Dutch observational docu-series following Louisa and Rosanna, a couple navigating life together through Rosanna's gender transition — one of the first Dutch reality formats to centre a transgender personal journey with warmth and intimacy over multiple years."},{"t":"Beruchte Sloppenwijken: Ewout in de Ghetto","y":"2018","te":"Netherlands","p":"RTL 5","g":"Factual / Documentary","s":"Dutch investigative documentary mini-series in which journalist Ewout Genemans immerses himself in the world ed across multiple categories with highlights, demonstrations and celebrity participation, recognising a profession often overlooked by mainstream ceremonies."},{"t":"Flirty Something","y":"2000s","te":"USA / International","p":"Various","g":"Reality Dating","s":"Relationship reality format following young singles navigating modern dating, attraction and romance — participants pursue potential partners while confronting emotional obstacles and rival competition, with emphasis on chemistry, personal growth and social dynamics."},{"t":"Mittermeier and Friends","y":"2000s","te":"Germany","p":"German TV","g":"Celebrity Reality","s":"Entertainment variety format built around German comedian Michael Mittermeier and guest performers — combining stand-up, sketches, interviews and live performances with the host's personality as the central engine."},{"t":"Rêve d'un soir","y":"2000s","te":"France","p":"TF1 / France 2","g":"Makeover Reality","s":"Emotional French reality format in which participants are granted a special experience, celebration or dream event for a single memorable evening — combining personal transformation, surprise and feel-good storytelling with a strong emotional payoff."},{"t":"The X Zone","y":"2000s","te":"International","p":"Various","g":"Paranormal Reality","s":"Factual entertainment format exploring unexplained phenomena, paranormal claims and unusual mysteries — investigators, experts and witnesses contribute to each case in a documentary structure appealing to audiences interested in the unknown."},{"t":"Hell in the Pacific","y":"2000s","te":"UK / International","p":"Various","g":"Factual / Documentary","s":"Historical documentary examining major conflicts, battles and military campaigns in the Pacific theatre — using archive footage, expert analysis and personal testimonies to reconstruct events while emphasising both strategic history and human experience."},{"t":"La crociera","y":"2000s","te":"Italy","p":"Italian TV","g":"Factual Travel","s":"I document.getElementById("dbCount").textContent = DB.length.toLocaleString("nl");
var genres = [];
var seen = {};
DB.forEach(function(f){ if(f.g && !seen[f.g]){ seen[f.g]=1; genres.push(f.g); } });
genres.sort();
var gSel = document.getElementById("genreFilter");
genres.forEach(function(g){ var o = document.createElement("option"); o.value = g; o.textContent = g; gSel.appendChild(o); });

function pickRandom(arr, n) {
  var copy = arr.slice().sort(function(){ return Math.random()-0.5; });
  return copy.slice(0, n);
}

function selectFormats(input, genre, territory, n) {
  var pool = DB.slice();
  if (genre) pool = pool.filter(function(f){ return f.g === genre; });
  if (territory) pool = pool.filter(function(f){ return f.te && f.te.indexOf(territory) !== -1; });
  var words = input.toLowerCase().split(/\s+/).filter(function(w){ return w.length > 3; });
  var scored = pool.map(function(f) {
    var hay = (f.t + " " + f.s + " " + f.g).toLowerCase();
    var score = 0;
    words.forEach(function(w){ if(hay.indexOf(w) !== -1) score += 2; });
    var yr = parseInt(f.y) || 0;
    if (yr >= 2022) score += 1;
    if (yr >= 2024) score += 1;
    return Object.assign({}, f, {score: score});
  });
  scored.sort(function(a,b){ return b.score - a.score; });
  var top = scored.slice(0, 6);
  var rest = scored.slice(6).sort(function(){ return Math.random()-0.5; }).slice(0, n-6);
  return top.concat(rest);
}

function buildPrompt(userInput, fmts) {
  var lines = fmts.map(function(f){
    return "[" + f.t + " | " + f.g + " | " + f.te + " | " + f.y + "]\n" + f.s;
  }).join("\n\n");
  return "Je bent een creatief TV format developer bij een groot productiehuis. Je werkt voor de Nederlandse markt maar denkt internationaal.\n\nEen collega heeft je het volgende gegeven:\n\"" + userInput + "\"\n\nJe hebt toegang tot deze bewezen TV formats als inspiratie:\n\n" + lines + "\n\nGebruik de formats NIET als kopie. Gebruik mechanics, settings, sociale dynamieken of structuren als bouwstenen voor iets nieuws.\n\nGenereer 3 originele show-ideeen die aansluiten op de input.\n\nGeef EXACT dit JSON, geen preamble, geen markdown:\n{\"ideas\":[{\"title\":\"TITEL\",\"hook\":\"pitch in 2 zinnen.\",\"format\":\"format beschrijving 3-4 zinnen.\",\"mechanic\":\"kern mechaniek 1 zin.\",\"why_now\":\"waarom relevant nu.\",\"dna\":[{\"from\":\"Bestaand format titel\",\"element\":\"wat je eruit haalt\"}]}]}";
}

function renderCard(idea, idx) {
  var dna = (idea.dna || []).map(function(d){
    return '<span class="dna-pill"><strong>' + d.from + '</strong> &rarr; ' + d.element + '</span>';
  }).join("");
  return '<div class="idea-card">' +
    '<div class="card-top">' +
    '<div class="card-num">Idee ' + (idx+1) + '</div>' +
    '<div class="card-title">' + (idea.title||"") + '</div>' +
    '<div class="card-hook">' + (idea.hook||"") + '</div>' +
    '</div>' +
    '<div class="card-body">' +
    '<div class="card-section"><div class="sl">Format</div><div class="sv">' + (idea.format||"") + '</div></div>' +
    '<div class="card-section"><div class="sl">Kern mechaniek</div><div class="sv">' + (idea.mechanic||"") + '</div>' +
    '<div class="sl" style="margin-top:12px">Waarom nu</div><div class="sv">' + (idea.why_now||"") + '</div></div>' +
    '</div>' +
    (dna ? '<div class="card-dna"><div class="sl">Format DNA</div><div class="dna-pills">' + dna + '</div></div>' : '') +
    '</div>';
}

var lastIdeas = [], lastSelected = [];

async function generate() {
  var input = document.getElementById("userInput").value.trim();
  if (!input) { alert("Typ eerst een input."); return; }
  var genre = document.getElementById("genreFilter").value;
  var territory = document.getElementById("territoryFilter").value;
  var btn = document.getElementById("goBtn");
  var out = document.getElementById("output");
  btn.disabled = true;
  out.innerHTML = '<div class="loading"><span class="spinner"></span>Zoekt relevante formats en genereert ideeen&hellip;</div>';
  try {
    lastSelected = selectFormats(input, genre, territory, 12);
    var resp = await fetch("/proxy", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 1200,
        messages: [{role: "user", content: buildPrompt(input, lastSelected)}]
      })
    });
    var data = await resp.json();
    var raw = (data.content || []).map(function(c){ return c.text || ""; }).join("");
    var parsed;
    try { parsed = JSON.parse(raw.replace(/```json|```/g,"").trim()); }
    catch(e) { var m = raw.match(/\{[\s\S]*\}/); if(m) parsed = JSON.parse(m[0]); else throw new Error("Kon output niet parsen."); }
    var ideas = parsed.ideas || [];
    if (!ideas.length) throw new Error("Geen ideeen ontvangen.");
    lastIdeas = ideas;
    var ctxBar = '<div class="context-bar"><strong>' + lastSelected.length + ' formats</strong> gebruikt als context &mdash; ' + lastSelected.slice(0,4).map(function(f){return f.t;}).join(", ") + (lastSelected.length > 4 ? " e.a." : "") + '</div>';
    out.innerHTML = ctxBar + ideas.map(function(idea,i){ return renderCard(idea,i); }).join("") +
      '<div class="export-row"><button onclick="exportTxt()">Exporteer .txt</button><button onclick="exportJSON()">Exporteer .json</button></div>';
  } catch(err) {
    out.innerHTML = '<div class="error">Fout: ' + err.message + '</div>';
  }
  btn.disabled = false;
}

function exportTxt() {
  if (!lastIdeas.length) return;
  var txt = "FORMAT SPARRING\n" + "=".repeat(40) + "\n\nINPUT: " + document.getElementById("userInput").value + "\n\n";
  lastIdeas.forEach(function(idea, i) {
    var s = idea.scores || {};
    txt += "IDEE " + (i+1) + ": " + idea.title + "\n" + "-".repeat(30) + "\n";
    txt += "HOOK:\n" + idea.hook + "\n\nFORMAT:\n" + idea.format + "\n\n";
    txt += "KERN MECHANIEK: " + idea.mechanic + "\nWAAROM NU: " + idea.why_now + "\n";
    txt += "FORMAT DNA:\n" + (idea.dna||[]).map(function(d){ return "  " + d.from + " -> " + d.element; }).join("\n") + "\n\n";
  });
  dl("format_sparring.txt", txt, "text/plain");
}
function exportJSON() {
  if (!lastIdeas.length) return;
  dl("format_sparring.json", JSON.stringify({input: document.getElementById("userInput").value, ideas: lastIdeas}, null, 2), "application/json");
}
function dl(name, content, type) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content],{type:type}));
  a.download = name; a.click();
}
function clearAll() {
  document.getElementById("userInput").value = "";
  document.getElementById("output").innerHTML = "";
  lastIdeas = []; lastSelected = [];
}
document.getElementById("userInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
});
</script>
