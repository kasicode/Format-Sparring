empt to complete challenges inspired by hamster behaviour — running wheels, maze navigation, food-gathering tasks — competing against actual hamsters in their natural element. A fun, family-oriented physical comedy format."},{"t":"Second Chance Stage","y":"2024","te":"International","p":"Multiple","g":"Talent Competition","s":"A talent competition for singers, performers and entertainers who were previously rejected, eliminated or overlooked in earlier competitions — given a second shot at a professional career in front of a new judging panel. Built on the universal appeal of redemption."},{"t":"The List","y":"2024","te":"UK / International","p":"ITV (UK)","g":"Gameshow","s":"A trivia-meets-strategy gameshow in which contestants must correctly rank items in lists — by size, value, age, speed, popularity — within a time limit. The format rewards systematic thinking and real-world knowledge over pure recall."},{"t":"Mental Samurai","y":"2019–","te":"USA / International","p":"Fox (US) + Spain","g":"Gameshow","s":"The ultimate test of skill, focus and stamina: contestants strap into a 360-degree rotating arm and answer questions while being spun and moved at speed, testing memory, spatial awareness and mental agility simultaneously. Fox US original; adapted in Spain (Mediaset) and internationally through WBITVP."},{"t":"Sing Again","y":"2024","te":"International","p":"Multiple","g":"Talent Competition","s":"A talent competition for singers who once had their moment in the spotlight but have since faded from public view — a second-chance singing format that discovers what happened to former pop stars and whether they still have what it takes to win over a live audience."},{"t":"Roller Jam","y":"2024","te":"UK / International","p":"Channel 4 (UK)","g":"Reality Competition","s":"A roller-skating competition format: celebrities and athletes compete in roller disco, roller derby and speed challenges in a spectacular arena setting. A colourful, high-energy entertainment format drawing on the global nostalgia for roller-skating culture."},{"t":"Lotería Loca","y":"2024","te":"USA / Latin America","p":"Univision / TelevisaUnivision","g":"Gameshow","s":"A Spanish-language lottery-meets-gameshow format for the Hispanic market: contestants play the traditional Mexican Lotería card game in an elevated, high-stakes primetime format with celebrity hosts and escalating prize rounds."},{"t":"Soundtrack of Love","y":"2024","te":"International","p":"Multiple","g":"Reality Dating","s":"A music-driven dating experiment: singles are matched based entirely on their musical tastes and emotional responses to songs — rather than appearance or profiles. Music as a language of love, with reveals of compatibility only possible through shared emotional resonance."},{"t":"Cash or Trash","y":"2012–","te":"Germany / International","p":"ZDF (DE) + BBC One (UK) + France 2 + Multiple","g":"Factual Entertainment","s":"Antiques and collectibles experts assess whether everyday people's prized possessions are worth a fortune — or worthless junk. One of WBITVP and ZDF Studios' most globally travelled formats: 1,000+ episodes in Germany alone (Bares für Rares), 8,000+ globally. Adapted in 13+ countries including UK (The Bidding Room, BBC One), France, Italy, Poland, Greece, Austria and Morocco."},{"t":"Supernanny","y":"2004–","te":"UK / International","p":"Channel 4 (UK) + Multiple","g":"Factual Entertainment","s":"An experienced nanny or childcare expert spends time helping families with misbehaving children and stressed parents, demonstrating innovative and time-tested methods to resolve bad behaviour, excessive screen time and modern parenting challenges. A Channel 4 classic adapted in 21+ countries globally."},{"t":"The Repair Shop","y":"2017–","te":"UK / International","p":"BBC One (UK)","g":"Factual / Craft","s":"Master craftspeople restore treasured family heirlooms and precious objects brought in by their emotional owners. BBC One's warmly loved factual entertainment hit — internationally positioned by WBITVP as a soft-format alternative to competition reality. Multiple international versions and spin-offs."},{"t":"Who Do You Think You Are?","y":"2004–","te":"UK / International","p":"BBC One (UK) + Multiple","g":"Factual / Documentary","s":"Celebrities trace their family history and ancestry with the help of professional genealogists — often uncovering surprising, moving and historically significant stories. One of BBC One's longest-running factual formats; adapted in 20+ countries including US, Australia, Ireland, Canada and Israel."},{"t":"House Hunters","y":"1999–","te":"USA / International","p":"HGTV (US) + Multiple","g":"Factual / Property","s":"A couple or individual searches for a new home, touring three properties before making their final choice — with personal priorities and budget realities always in tension. HGTV's most enduring format: 250+ seasons, international editions including House Hunters International."},{"t":"The Repair Shop: On the Road","y":"2024","te":"UK","p":"BBC One (UK)","g":"Factual / Craft","s":"The Repair Shop goes on location: master craftspeople travel across Britain to discover dying craft skills and restore objects in situ, bringing the warmth of the original format to new settings and communities beyond the iconic barn."},{"t":"Back in Time For…","y":"2015–","te":"UK / International","p":"BBC Two (UK)","g":"Living History","s":"Time-travelling families transform their homes and lives to experience life decade by decade — from the 1940s through to the 1980s — living authentically within the food, clothing, technology and social norms of each era. An immersive living-history format from Wall to Wall with multiple series and spin-offs."},{"t":"Five Star Chef","y":"2023","te":"UK","p":"Channel 4 (UK) / Netflix (international)","g":"Talent Competition","s":"Chefs compete to win a stunning restaurant prize — the chance to run their own five-star establishment. A high-stakes culinary competition combining cooking talent with entrepreneurial vision, produced by Twenty Twenty for Channel 4 UK and distributed on Netflix internationally."},{"t":"The Nevermets","y":"2023","te":"UK","p":"Channel 4 (UK)","g":"Reality Dating","s":"Long-distance online lovers meet each other in real life for the first time — having built deep emotional connections entirely through screens. A documentary-reality format exploring modern digital love: the joy and terror of moving from pixels to physical presence."},{"t":"Brides in Business","y":"2024","te":"International","p":"Multiple","g":"Reality Competition","s":"Bridal industry entrepreneurs and wedding business owners compete to land major clients and contracts in a business-meets-bridal competition format — combining the commercial energy of The Apprentice with the glamour and emotion of the wedding industry."},{"t":"Cook Once, Eat Twice","y":"2024","te":"UK / International","p":"Multiple","g":"Factual / Food","s":"A practical cooking format built around the concept of batch cooking and clever repurposing: chefs and food presenters demonstrate how to prepare one core ingredient or dish and transform it into multiple distinct meals, with a strong focus on household economy and reducing waste."},{"t":"My Dream Green Home","y":"2024","te":"UK / International","p":"Multiple","g":"Lifestyle / Craft","s":"A property and lifestyle format following homeowners as they transform their homes into sustainable, eco-friendly living spaces — working with green architects, sustainable builders and environmental experts to reduce their carbon footprint without sacrificing comfort or design."},{"t":"What's the Big Deal?","y":"2024","te":"International","p":"Multiple","g":"Gameshow","s":"A negotiation-based gameshow in which contestants must identify which of several offered 'deals' hides the biggest prize — through a combination of instinct, psychological reading of the host and logical deduction. High-stakes, fast-paced and endlessly adaptable."},{"t":"Born From The Same Stranger","y":"2024","te":"UK","p":"Channel 4 / Expectation","g":"Factual / Documentary","s":"People who were conceived using donor sperm search for and meet their genetic half-siblings — strangers who share a biological father but have lived completely separate lives. A deeply emotional documentary-reality format exploring identity, family and the complexity of donor conception."},{"t":"Bring the Drama","y":"2025","te":"International","p":"Multiple","g":"Reality Competition","s":"A competitive drama performance format in which contestants — amateur actors, drama students and passionate performers — compete in acting challenges judged by industry professionals. Equal parts talent show and psychological game as performers reveal and conceal their true selves."},{"t":"Food Unwrapped","y":"2012–","te":"UK / International","p":"Channel 4 (UK)","g":"Factual / Food","s":"An investigative food factual series that reveals the surprising truth behind everyday food products — what's actually in them, how they're made and where they come from. Channel 4's long-running food investigation format, internationally distributed by WBITVP."},{"t":"My Family Mystery","y":"2024","te":"International","p":"Multiple","g":"Factual / Documentary","s":"Families uncover hidden or unknown chapters of their collective history — adoptions, wartime stories, secret relatives — in a warmly produced documentary-reality format that combines genealogical research with personal journeys of discovery and reconciliation."},{"t":"Outsiders","y":"2024","te":"International","p":"Multiple","g":"Reality Adventure","s":"A social experiment adventure format in which participants from radically different social backgrounds are placed together in extreme or unfamiliar environments — challenging their assumptions, testing their resilience and revealing what connects people across social divides."},{"t":"Toy Hospital","y":"2024","te":"UK / International","p":"Multiple","g":"Factual / Craft","s":"Skilled toy restorers bring beloved but broken childhood toys and games back to life for their emotional owners — applying the warmth and craft of The Repair Shop to the uniquely nostalgic world of toys. A spin-off concept from the WBITVP craft-restoration format stable."},{"t":"FBoy Survival","y":"2026","te":"India","p":"Discovery Channel / D+ (India)","g":"Reality Dating","s":"The Indian adaptation of FBoy Island — blending the format's dating-competition premise with a survival-adventure setting in a harsh desert environment. Discovery India's 20-episode local version, produced by Fox6 Media. Launched February 2026; the first FBoy adaptation to incorporate a genuine survival challenge alongside the dating game."},{"t":"Reality Queens of the Jungle: Family Edition","y":"2026","te":"Netherlands","p":"Videoland (NL)","g":"Celebrity Reality","s":"The latest extension of the Reality Queens franchise: familiar Dutch reality stars tackle the jungle alongside a member of their own family — a relative who knows them best. Demanding challenges and jungle trials test both the star-family bond and individual resilience in this Videoland commission."},{"t":"FBoy Island (India)","y":"2026","te":"India","p":"Discovery / D+","g":"Reality Dating","s":"The Indian commission of the FBoy Island format, produced by Fox6 Media for Discovery Channel and D+ India. Announced October 2025, launching February 2026. FBoy Island now has active versions in Australia, Belgium, Denmark, Netherlands, New Zealand, Sweden and India."},{"t":"$25 Million Dollar Hoax","y":"2004","te":"USA","p":"NBC","g":"Hoax / Prank Reality","s":"A woman pretends to have won a $25 million lottery and must convince her family the money has changed her personality — testing family loyalty and revealing reactions to sudden wealth. One of the early prank-reality experiments to centre deception on the immediate family."},{"t":"'Til Death Do Us Part: Carmen and Dave","y":"2004","te":"USA","p":"MTV","g":"Celebrity Reality","s":"MTV reality series following Carmen Electra and Dave Navarro as they plan their wedding — an intimate celebrity access format capturing the drama and emotions of a high-profile relationship. Part of the early 2000s celebrity docu-reality wave."},{"t":"100 Hours","y":"2002","te":"New Zealand","p":"TV2 (NZ)","g":"Reality Competition","s":"New Zealand reality competition in which contestants competed across mental, physical and dexterity-based challenges under continuous camera coverage — an early local iteration of the multi-discipline competition format with strategy and bluffing elements."},{"t":"12 Corazones","y":"2005–2017","te":"USA","p":"Telemundo","g":"Reality Dating","s":"Spanish-language dating game show in which contestants are identified by zodiac signs and pair off through games and audience voting. One of Telemundo's longest-running original unscripted formats, blending astrology with studio dating spectacle."},{"t":"13: Fear Is Real","y":"2009","te":"USA","p":"The CW","g":"Reality Competition","s":"Horror-themed reality competition in which contestants face fear-based challenges and psychological stress in an elimination format. An early attempt to fuse horror atmosphere with the elimination mechanics of mainstream reality competition."},{"t":"19 Kids and Counting","y":"2008–2015","te":"USA","p":"TLC","g":"Factual Entertainment","s":"Documentary-style reality following the Duggar family — a very large, deeply conservative Christian family — through daily life with 19 children. One of TLC's defining faith-and-family factual entertainment formats."},{"t":"30 Days (TV series)","y":"2005–2008","te":"USA","p":"FX","g":"Social Experiment","s":"Morgan Spurlock-created social experiment in which participants spend 30 days living in circumstances radically different from their own — challenging perspectives on immigration, religion, disability and culture through immersive lived experience."},{"t":"3AM (TV series)","y":"2015","te":"USA","p":"Showtime","g":"Celebrity Reality","s":"Observational series following performers, nightlife figures and cultural players through New York City's late-night scene — an access documentary capturing subculture and celebrity at the intersection of performance and private life."},{"t":"8th & Ocean","y":"2006","te":"USA","p":"MTV","g":"Factual Entertainment","s":"MTV docu-soap following young models living and competing in Miami's South Beach fashion scene — an aspirational access format tracking the daily realities of early-career modelling ambition."},{"t":"A Casa (TV series)","y":"2017","te":"Brazil","p":"RecordTV","g":"Reality Competition","s":"Brazilian reality format in which a large number of contestants are crowded into one house and compete for survival through social pressure and scarcity — an overcrowded-house endurance experiment from RecordTV."},{"t":"A Fazenda","y":"2009–present","te":"Brazil","p":"RecordTV","g":"Celebrity Reality","s":"Brazilian version of The Farm: celebrities are placed on a rural farm where they complete agricultural tasks, face eliminations and compete for public votes. One of Brazil's highest-rated ongoing reality formats with 15+ seasons."},{"t":"A Makeover Story","y":"2000s","te":"USA","p":"TLC","g":"Makeover Reality","s":"TLC lifestyle makeover series in which participants receive complete style and appearance transformations — a simple before-and-after format that established TLC's identity as a home for personal transformation reality."},{"t":"A Shot at Love with Tila Tequila","y":"2007–2008","te":"USA","p":"MTV","g":"Reality Dating","s":"Dating competition in which both men and women competed for a relationship with bisexual social media personality Tila Tequila — a groundbreaking premise for its time that brought LGBTQ+ representation to mainstream cable dating formats."},{"t":"Abby's Ultimate Dance Competition","y":"2012–2013","te":"USA","p":"Lifetime","g":"Talent Competition","s":"Youth dance competition series hosted by Abby Lee Miller (Dance Moms) in which young dancers competed through high-pressure performance challenges — combining competitive dance with the heated dynamics of stage parents and demanding coaching."},{"t":"Adorableness (TV series)","y":"2021","te":"USA","p":"MTV","g":"Clip Show","s":"Comedy clip show built around cute and heartwarming viral videos — a spin-off from the Ridiculousness format family, leaning into feel-good content for MTV's younger digital audience."},{"t":"Afghan Star (TV series)","y":"2005–present","te":"Afghanistan","p":"Tolo TV","g":"Talent Competition","s":"Afghan singing competition based on the Idol format with public voting — widely considered one of the most significant media and cultural events in post-Taliban Afghanistan, documented in an award-winning film of the same name."},{"t":"Age of Love (TV series)","y":"2007","te":"USA","p":"NBC","g":"Reality Dating","s":"Dating series in which tennis player Mark Philippoussis dated women from two age groups — framed as 'kittens' (20s) vs 'cougars' (40s) — exploring generational attitudes to attraction and long-term compatibility."},{"t":"Ainori","y":"1999–2009","te":"Japan","p":"Fuji TV","g":"Reality Dating","s":"Japanese reality series in which young singles travel together overseas in a distinctive pink van, pursuing romance along the way. One of the most iconic Japanese unscripted formats; revived on Netflix Japan in 2017."},{"t":"Airline (1998 TV series)","y":"1998–2006","te":"UK","p":"ITV","g":"Occupational Reality","s":"British observational docu-soap following staff and passengers at easyJet — one of the defining UK workplace reality formats of the late 1990s, generating strong ratings through real customer conflict and operational chaos."},{"t":"Airline (American TV series)","y":"2004–2005","te":"USA","p":"A&E","g":"Occupational Reality","s":"American adaptation of the Airline format following Southwest Airlines employees and passengers — translating the UK workplace-reality model to a major US carrier with a focus on customer service pressure and everyday drama."},{"t":"Airport (TV series)","y":"1996–2008","te":"UK","p":"BBC One","g":"Occupational Reality","s":"BBC fly-on-the-wall documentary series about Heathrow Airport staff and operations — one of the BBC's longest-running and most-watched observational documentary series, establishing the airport as a defining unscripted format location."},{"t":"Alaskan Bush People","y":"2014–2022","te":"USA","p":"Discovery Channel","g":"Factual Entertainment","s":"Series following the Brown family as they live and work in remote parts of Alaska and the Pacific Northwest — an off-grid survivalist family format built on an extreme lifestyle identity."},{"t":"Almost Genius","y":"2015–2016","te":"USA","p":"truTV","g":"Clip Show","s":"Comedy clip show featuring internet videos of people attempting unusual or risky ideas — celebrating near-brilliant human attempts and the fine line between genius and spectacular failure."},{"t":"America's Best Dance Crew","y":"2008–2015","te":"USA","p":"MTV","g":"Talent Competition","s":"Dance crew competition in which groups performed choreographed routines and advanced through weekly judging and audience votes. MTV's flagship dance format; launched numerous careers in street and commercial dance."},{"t":"America's Funniest Home Videos","y":"1989–present","te":"USA","p":"ABC","g":"Clip Show","s":"The original and longest-running US home-video comedy format: viewer-submitted funny clips compete for cash prizes. A foundational format in the history of unscripted television, now 36+ seasons and still airing."},{"t":"America's Funniest Home Videos: Animal Edition","y":"2021–present","te":"USA","p":"Nat Geo Wild","g":"Clip Show","s":"Animal-focused spin-off of America's Funniest Home Videos featuring humorous pet and animal clips — extending the franchise to a nature and pet-loving audience on Nat Geo Wild."},{"t":"America's Funniest People","y":"1990–1994","te":"USA","p":"ABC","g":"Clip Show","s":"Spin-off of America's Funniest Home Videos combining comedy home videos with sketches and amateur performances — an early experiment in expanding the home-video format into broader variety territory."},{"t":"America's Most Smartest Model","y":"2007","te":"USA","p":"VH1","g":"Reality Competition","s":"VH1 modelling competition that tested contestants on both physical appearance and general intelligence — deliberately challenging model stereotypes through academic-style tests alongside runway and photo challenges."},{"t":"America's Most Wanted","y":"1988–2021","te":"USA","p":"Fox / Lifetime / Fox Nation","g":"Factual Reality","s":"Long-running public-service reality series profiling real fugitives and asking viewers to help law enforcement locate suspects — one of the most socially impactful unscripted formats in American television history, credited with helping capture 1,000+ criminals."},{"t":"America's Next Top Model","y":"2003–2018","te":"USA","p":"UPN / CW / VH1","g":"Talent Competition","s":"Tyra Banks's modelling competition in which aspiring models competed through photo shoots, runway challenges and eliminations. One of the most influential reality formats of the 2000s — spawning 20+ international adaptations and defining aspirational fashion reality."},{"t":"America's Top Dog","y":"2020–2021","te":"USA","p":"A&E","g":"Reality Competition","s":"Competition series in which elite police K9s and civilian dogs run obstacle-course challenges with their handlers — a format celebrating the bond between working dogs and their partners across a range of demanding disciplines."},{"t":"America's Worst Driver","y":"2010","te":"USA","p":"Travel Channel","g":"Reality Competition","s":"Reality series that put self-identified bad drivers through challenges designed to identify and correct America's worst driving habits — a combination of comic incompetence and genuine driving education."},{"t":"American Candidate","y":"2004","te":"USA","p":"Showtime","g":"Social Experiment","s":"Reality competition in which civilian candidates competed through campaign-style challenges to become a mock presidential candidate — a rare experiment in treating democratic politics as a reality contest format."},{"t":"American Casino","y":"2004–2005","te":"USA","p":"Discovery Channel","g":"Occupational Reality","s":"Reality series following employees and the daily operations of the Green Valley Ranch casino in Las Vegas — an observational workplace format set in the high-stakes, 24-hour atmosphere of a Nevada casino resort."},{"t":"American Chopper","y":"2003–2019","te":"USA","p":"Discovery / TLC","g":"Occupational Reality","s":"Series following Orange County Choppers as the Teutul family build custom motorcycles under deadline pressure — combining craft spectacle with explosive father-son conflict in one of Discovery's defining reality formats."},{"t":"American Dream Builders","y":"2014","te":"USA","p":"NBC","g":"Reality Competition","s":"Design competition in which professional builders and designers renovated American homes in team-based challenges — a short-lived NBC attempt to bring competitive home renovation to primetime."},{"t":"American Grit","y":"2016–2017","te":"USA","p":"Fox","g":"Reality Competition","s":"Teams of civilians faced military-style endurance and survival challenges under the guidance of real special operations veterans — combining military discipline with personal resilience in a physically demanding competition format."},{"t":"American Hot Rod","y":"2004–2008","te":"USA","p":"Discovery Channel","g":"Occupational Reality","s":"Series following Boyd Coddington's legendary hot-rod shop as vehicles were designed, built and delivered under intense deadline pressure — a craft-and-deadline format built on automotive artistry and shop floor conflict."},{"t":"American Idol","y":"2002–present","te":"USA","p":"Fox / ABC","g":"Talent Competition","s":"The US adaptation of Pop Idol: the original and most globally successful singing competition format. Singers audition, perform live and are eliminated by public vote. 24 seasons; launched the careers of Kelly Clarkson, Carrie Underwood, Jennifer Hudson and many more."},{"t":"American Inventor","y":"2006–2007","te":"USA","p":"ABC","g":"Reality Competition","s":"Reality competition in which everyday inventors pitched their products and competed for development funding and prize money — an early precursor to the Dragon's Den/Shark Tank inventor competition format."},{"t":"American Juniors","y":"2003","te":"USA","p":"Fox","g":"Talent Competition","s":"American Idol spin-off focused on child singers competing for spots in a manufactured youth pop group — an early experiment in extending the Idol franchise to younger demographics."},{"t":"American Pickers","y":"2010–present","te":"USA","p":"History Channel","g":"Factual Entertainment","s":"Series following Mike Wolfe and Frank Fritz as they travel across America searching for antiques, collectibles and buried treasures in barns, estates and storage spaces — one of History Channel's most durable and popular unscripted formats."},{"t":"American Restoration","y":"2010–2016","te":"USA","p":"History Channel","g":"Factual / Craft","s":"Series centred on Rick's Restorations and partner shops bringing vintage objects, signage and vehicles back to their original condition — a craft-restoration format built around before-and-after reveals and the stories behind the objects."},{"t":"Amish in the City","y":"2004","te":"USA","p":"UPN","g":"Social Experiment","s":"Reality series in which young Amish people on rumspringa and non-Amish participants lived together in Los Angeles — a coming-of-age culture-clash experiment exploring identity, belief and the transition from a closed community into the modern world."},{"t":"An American Family","y":"1973","te":"USA","p":"PBS","g":"Factual / Documentary","s":"Landmark early documentary series following the Loud family — widely cited as one of the first true reality television formats. Its fly-on-the-wall approach and capture of a real family's dissolution set a template that would define the genre for decades."},{"t":"Antiques Roadshow","y":"1979–present","te":"UK / International","p":"BBC / PBS","g":"Factual Entertainment","s":"Travelling appraisal series in which experts assess antiques and collectibles brought in by members of the public — a warmly beloved format built on surprise value reveals and the personal histories behind objects. One of the most durable unscripted formats globally."},{"t":"Are You Hot?","y":"2003","te":"USA","p":"ABC","g":"Reality Competition","s":"Reality competition in which contestants were judged solely on their physical attractiveness by celebrity panellists — a deliberately provocative premise that generated controversy but short-lived ratings."},{"t":"Around Naija","y":"2010s","te":"Nigeria","p":"Various","g":"Factual Travel","s":"Nigerian travel reality programme exploring locations, people and culture across Nigeria — one of the country's early unscripted formats to treat national identity through a road-trip discovery lens."},{"t":"Arthur Godfrey's Talent Scouts","y":"1948–1958","te":"USA","p":"CBS","g":"Talent Competition","s":"One of the earliest American television talent shows: Arthur Godfrey presented performers competing for audience approval. An important precursor to the modern talent competition format that launched careers including Patsy Cline and Tony Bennett."},{"t":"Asayan","y":"1995–2002","te":"Japan","p":"TV Tokyo","g":"Music Reality","s":"Japanese variety and audition programme best known for launching music acts including Morning Musume. One of the most influential Japanese talent-discovery formats, documenting the behind-the-scenes creation of pop groups through extended audition processes."},{"t":"Auction Hunters","y":"2010–2015","te":"USA","p":"Spike TV","g":"Factual Entertainment","s":"Series following Allen Haff and Clint Jones as they bid on abandoned storage units and sell valuable items they discover inside — a treasure-hunting docu-reality built on the thrill of unknown contents and the art of the resale."},{"t":"Audrina","y":"2011","te":"USA","p":"VH1","g":"Celebrity Reality","s":"Reality series following Audrina Patridge (The Hills) after her departure from that show — tracking her career, family relationships and personal life as she navigated post-reality celebrity."},{"t":"Australia's Funniest Home Videos","y":"1990–2014","te":"Australia","p":"Nine Network","g":"Clip Show","s":"Australian version of the global home-video comedy format — featuring viewer-submitted clips of accidents, pet antics and family mishaps. Ran for over 20 years on Nine, making it one of Australia's longest-running unscripted entertainment programmes."},{"t":"Australia's Next Top Model","y":"2005–2016","te":"Australia","p":"Fox8","g":"Talent Competition","s":"Australian adaptation of the Tyra Banks Top Model format — aspiring Australian models competed through photo shoots, runway challenges and eliminations, making it one of Australia's defining fashion reality formats."},{"t":"Australian Idol","y":"2003–present","te":"Australia","p":"Network 10 / Seven","g":"Talent Competition","s":"Australian adaptation of the Idol singing competition format — a national search for pop talent through auditions, live performances and public voting. Revived in 2023 after a decade off air."},{"t":"Australian Princess","y":"2005–2006","te":"Australia","p":"Network Ten","g":"Makeover Reality","s":"Transformation reality series in which ordinary Australian women were trained in aristocratic etiquette and social skills by English finishing-school experts — an aspirational makeover format built on the Cinderella fantasy of social elevation."},{"t":"Average Joe (show)","y":"2003–2005","te":"USA","p":"NBC","g":"Reality Dating","s":"Dating show in which a woman expecting conventionally attractive suitors was instead introduced to average-looking men — with later series adding handsome men as twists. A format that interrogated the gap between physical standards and genuine connection."},{"t":"Ax Men","y":"2008–2019","te":"USA","p":"History Channel","g":"Occupational Reality","s":"Series following logging crews working in dangerous forests and timber environments across the Pacific Northwest — an occupational reality format built on physical danger, mechanical complexity and the raw power of industrial logging."},{"t":"BBQ Pitmasters","y":"2009–2015","te":"USA","p":"TLC / Destination America","g":"Factual / Food","s":"Series following competitive barbecue teams and champion pitmasters as they cook for contests and face expert judging — a celebration of American regional barbecue culture and the near-religious devotion of competitive smoke cooking."},{"t":"Bachelor Pad","y":"2010–2012","te":"USA","p":"ABC","g":"Reality Competition","s":"The Bachelor franchise spin-off in which former contestants from The Bachelor and The Bachelorette lived together and competed in challenges combining romance with strategy for a $250,000 prize — an alumni competition format that preceded Bachelor in Paradise."},{"t":"Bachelor in Paradise","y":"2014–present","te":"USA","p":"ABC","g":"Reality Dating","s":"Bachelor franchise beach-resort spin-off in which former Bachelor and Bachelorette contestants date at a Mexican resort and participate in rose ceremonies — a rotating, sequel-oriented dating format that has run for 10+ seasons."},{"t":"Back to Reality (UK)","y":"2004","te":"UK","p":"Channel 5","g":"Reality Competition","s":"British series bringing together former reality TV contestants from multiple shows for a new competition — an early meta-reality experiment that anticipated the all-stars format trend by over a decade."},{"t":"Backyard Blitz","y":"2000–2007","te":"Australia","p":"Nine Network","g":"Home Makeover","s":"Australian lifestyle series in which backyards and outdoor spaces were redesigned and transformed for deserving homeowners — one of Australia's pioneering home makeover formats and a Nine Network ratings staple."},{"t":"Bad Girls Club","y":"2006–2017","te":"USA","p":"Oxygen","g":"Celebrity Reality","s":"Reality series placing women with confrontational personalities together in a shared mansion to follow conflict, drama and attempted personal growth — Oxygen's defining docu-soap format over 17 seasons."},{"t":"Bands Reunited","y":"2004–2005","te":"USA","p":"VH1","g":"Music Reality","s":"Series in which VH1 attempted to reunite disbanded music groups for one-off performances — a nostalgia format built on band history, lingering grievances and the question of whether musical chemistry survives years of separation."},{"t":"Bands on the Run","y":"2001","te":"USA","p":"VH1","g":"Music Reality","s":"Reality competition following unsigned bands simultaneously touring different US cities and competing on merchandise sales, ticket sales and fan engagement — a grassroots music hustle format."},{"t":"Bar Rescue","y":"2011–present","te":"USA","p":"Paramount Network","g":"Business Reality","s":"Jon Taffer's expert business intervention format: failing bars are diagnosed, renovated and relaunched under intense, confrontational guidance. One of the most long-running business makeover formats in American cable television."},{"t":"Basketball Wives","y":"2010–present","te":"USA","p":"VH1","g":"Celebrity Reality","s":"Celebrity-adjacent docu-soap following women romantically linked to professional basketball players — navigating friendship, status, conflict and personal growth in one of VH1's most enduring ensemble reality formats."},{"t":"BattleBots","y":"2000–present","te":"USA","p":"Comedy Central / ABC / Discovery","g":"Reality Competition","s":"Competition series in which engineering teams build remote-controlled fighting robots and battle them in an armoured arena — a format that celebrates creative destruction and STEM ingenuity in equal measure. Multiple revival seasons."},{"t":"Battle of the Ex Besties","y":"2017","te":"USA","p":"Oxygen","g":"Reality Competition","s":"Competition series in which former best friends were paired together in challenges designed to test whether they could work together and repair their fractured relationships — an emotional repair-through-competition format."},{"t":"Beadle's About","y":"1986–1996","te":"UK","p":"ITV","g":"Prank / Hidden Camera","s":"British hidden-camera prank series hosted by Jeremy Beadle — one of the most beloved and long-running prank formats in UK television history, running for 14 series and building complex, sustained setups around unwitting members of the public."},{"t":"Bear Whisperer","y":"2010","te":"USA","p":"Animal Planet","g":"Animal / Nature","s":"Series following wildlife expert Steve Searles as he managed bear encounters in Mammoth Lakes, California — a specialist nature-meets-reality format built around a charismatic expert and the genuine danger of human-bear conflict."},{"t":"Beat the Clock","y":"1950s–present","te":"USA","p":"CBS / ABC / Syndication","g":"Gameshow","s":"Classic studio gameshow in which contestants must complete physical stunts and tasks before time runs out — one of television's earliest and most widely adapted timed-challenge formats, originating in the 1950s."},{"t":"Beauty and the Geek","y":"2005–2008","te":"USA / International","p":"The WB / CW","g":"Social Experiment","s":"Social experiment and competition pairing women labelled 'beauties' with men labelled 'geeks' — challenging both sets of stereotypes through mutual education and social skill challenges. Adapted internationally including Australia, UK and Asia."},{"t":"Beg, Borrow & Deal","y":"2002","te":"USA","p":"ESPN","g":"Reality Adventure","s":"Reality competition in which teams travelled across the United States completing tasks with little or no money — a resourcefulness race testing negotiation, hustle and charm in the earliest days of the travel-competition format."},{"t":"Beija Sapo","y":"2005–2007","te":"Brazil","p":"MTV Brasil","g":"Reality Dating","s":"Brazilian youth dating game show featuring playful studio dating rounds and audience interaction — an early Latin American adaptation of the MTV-style dating format for a young domestic audience."},{"t":"Being Bobby Brown","y":"2005","te":"USA","p":"Bravo","g":"Celebrity Reality","s":"Reality series offering unfiltered access to singer Bobby Brown, Whitney Houston and their family life — one of the most candid and controversial celebrity docu-realities of its era, capturing a famous couple at a turbulent moment."},{"t":"Below Deck","y":"2013–present","te":"USA","p":"Bravo","g":"Occupational Reality","s":"Series following crew members living and working aboard luxury charter yachts during season — combining high-end service pressure, crew romance and interpersonal conflict in one of Bravo's most internationally successful docu-soap formats. Multiple spin-offs."},{"t":"Below Deck Mediterranean","y":"2016–present","te":"USA","p":"Bravo","g":"Occupational Reality","s":"Below Deck spin-off following yacht crews serving charter guests in Mediterranean locations — the same high-pressure service format with European glamour settings and a rotating cast of maritime hospitality staff."},{"t":"Best Ink","y":"2012–2014","te":"USA","p":"Oxygen","g":"Talent Competition","s":"Tattoo artist competition in which contestants completed ink challenges under time pressure and were judged on technical skill, creativity and execution — a specialist craft competition from Oxygen's alternative reality slate."},{"t":"Big Brother (American TV series)","y":"2000–present","te":"USA","p":"CBS","g":"Reality Competition","s":"US adaptation of the Dutch social experiment: housemates live under constant surveillance, compete for power in weekly competitions and vote each other out. One of CBS's most durable summer reality formats, now in its 26th season."},{"t":"Big Brother (Brazil)","y":"2002–present","te":"Brazil","p":"TV Globo","g":"Reality Competition","s":"Brazilian edition of Big Brother — one of the most watched television programmes in Brazil with massive national reach. Known for its record-breaking public voting audiences and its role as a cultural event."},{"t":"Big Brother (UK)","y":"2000–present","te":"UK","p":"Channel 4 / Channel 5 / ITV","g":"Reality Competition","s":"UK edition of the surveillance house format — one of the defining unscripted formats in British television history, with landmark seasons on Channel 4, a Channel 5 revival and an ITV relaunch from 2023."},{"t":"Big Brother (franchise)","y":"1999–present","te":"International","p":"Endemol / Banijay licensees","g":"Reality Competition","s":"The global Big Brother franchise: strangers isolated in a house under constant camera surveillance face nominations and evictions. The most adapted social experiment format in television history — 50+ versions across every inhabited continent."},{"t":"Black Love (TV series)","y":"2017–2022","te":"USA","p":"OWN","g":"Factual / Documentary","s":"Documentary series featuring Black couples sharing intimate stories of their relationships — how they met, how they stayed together and how they navigate love. A positive-representation format celebrating Black romance and long-term partnership."},{"t":"Blind Date (US television)","y":"1999–2006","te":"USA","p":"Syndication","g":"Reality Dating","s":"Syndicated dating format sending American singles on blind dates and annotating the footage with comic captions and thought bubbles — an influential format in making everyday dating compelling and funny for a mainstream audience."},{"t":"Blow Out (TV series)","y":"2004–2006","te":"USA","p":"Bravo","g":"Celebrity Reality","s":"Reality series following celebrity hairstylist Jonathan Antin as he managed his Beverly Hills salons and launched his own hair-care product line — an early brand-building celebrity docu-reality on Bravo."},{"t":"Boiling Points","y":"2004–2005","te":"USA","p":"MTV","g":"Prank / Hidden Camera","s":"MTV hidden-camera format testing how long people can maintain their composure while being subjected to staged irritating and infuriating situations — contestants receive cash rewards for not losing their temper."},{"t":"Bondi Vet","y":"2009–2016","te":"Australia","p":"Network Ten","g":"Animal / Nature","s":"Australian factual series following veterinarians — especially at Bondi Junction Veterinary Hospital — treating animals and managing complex cases. One of the most popular animal welfare formats in Australian television."},{"t":"Boot Camp (TV series)","y":"2001","te":"USA","p":"Fox","g":"Reality Competition","s":"Early reality competition in which contestants underwent authentic boot-camp-style military training and faced weekly eliminations for a cash prize — one of the first formats to subject civilians to real military physical and psychological pressure."},{"t":"Born Diva","y":"2003","te":"USA","p":"VH1","g":"Talent Competition","s":"Series following plus-size singers as they developed their vocal and performance skills in competition — an early format shining a light on underrepresented body types in mainstream music talent television."},{"t":"BossBabes","y":"2019","te":"New Zealand","p":"TVNZ","g":"Factual Entertainment","s":"New Zealand docu-reality series following a group of young entrepreneurial women navigating their personal and professional lives — an early local iteration of the female-entrepreneur lifestyle docu-soap format."},{"t":"Boston EMS","y":"2015","te":"USA","p":"ABC","g":"Occupational Reality","s":"Short-run documentary series following emergency medical technicians and paramedics working in Boston — a real emergency-services access format built on high-stakes frontline medical decisions."},{"t":"Boston Med","y":"2010","te":"USA","p":"ABC","g":"Occupational Reality","s":"Documentary series following doctors, nurses and patients at Boston-area hospitals through real medical cases — one of ABC's premium hospital access documentaries, produced with the cooperation of leading Boston medical institutions."},{"t":"Botched (TV series)","y":"2014–present","te":"USA","p":"E!","g":"Makeover Reality","s":"Series following celebrity plastic surgeons Terry Dubrow and Paul Nassif as they attempt to repair extreme cosmetic surgery complications — combining the grotesque with genuine medical expertise in one of E!'s most distinctive and durable formats."},{"t":"Boy Meets Boy (TV)","y":"2003","te":"USA","p":"Bravo","g":"Reality Dating","s":"Groundbreaking dating show in which a gay bachelor chose from male suitors — with the twist that some contestants were secretly straight and would win money if chosen. One of the first LGBT-centred primetime US reality dating formats."},{"t":"Boys will be Girls","y":"2006","te":"UK","p":"E4","g":"Social Experiment","s":"UK social experiment in which young men lived their daily lives while presenting as women — exploring gender perceptions and social behavior through a lived immersive experience. An early gender-swap reality experiment for Channel 4's youth network."},{"t":"Brandy & Ray J: A Family Business","y":"2010–2011","te":"USA","p":"VH1","g":"Celebrity Reality","s":"Reality series following siblings Brandy and Ray J Norwood as they managed careers, family relationships and a joint entertainment business — a sibling celebrity docu-reality from VH1's early 2010s personality-driven unscripted slate."},{"t":"Branson Famous","y":"2014–2015","te":"USA","p":"truTV","g":"Family Docu-Reality","s":"Reality musical docu-series following the Mabe family and their long-running variety show in Branson, Missouri — an inside look at a small-town showbusiness dynasty maintaining a multi-generational entertainment tradition."},{"t":"Brat Camp","y":"2005–2007","te":"UK / USA","p":"Channel 4 / ABC","g":"Behavioural Reality","s":"Reality series sending troubled teenagers to wilderness-therapy programmes to address behaviour and family conflict — an early UK-US co-production exploring the emotional and social turnaround of at-risk youth."},{"t":"Braxton Family Values","y":"2011–2020","te":"USA","p":"WE tv","g":"Family Docu-Reality","s":"Reality series following singer Toni Braxton and her sisters as they navigate family relationships, career pressures and personal conflicts across nine seasons on WE tv."},{"t":"Breaking Amish","y":"2012–2014","te":"USA","p":"TLC","g":"Social Experiment","s":"Series following young adults from Amish and Mennonite communities experiencing life outside their communities for the first time — navigating the culture clash between traditional values and modern city life."},{"t":"Breaking Amish: Brave New World","y":"2013","te":"USA","p":"TLC","g":"Social Experiment","s":"Spin-off following Breaking Amish cast members as they continue building independent lives after leaving their religious communities — a post-exit follow-up journey."},{"t":"Bridalplasty","y":"2010–2011","te":"USA","p":"E!","g":"Makeover Reality","s":"Competition in which brides-to-be competed in weekly challenges to win cosmetic surgery procedures toward a dream wedding. An extreme premise combining bridal competition with plastic surgery elimination."},{"t":"Bring It! (TV series)","y":"2014–2019","te":"USA","p":"Lifetime","g":"Youth Reality","s":"Lifetime series following the Dancing Dolls hip-hop majorette team and their formidable coach Dianna Williams through intensive training and competitions — combining athletic pressure with parent-coach conflict."},{"t":"Bringing Up Bates","y":"2015–2021","te":"USA","p":"UPtv","g":"Family Docu-Reality","s":"Reality series following Gil and Kelly Jo Bates and their large Tennessee family — a faith-centred family observational format built on the everyday logistics and warmth of a very large conservative household."},{"t":"Britain's Got Talent","y":"2007–present","te":"UK","p":"ITV","g":"Talent Competition","s":"British open-variety talent competition in which acts of all types — singers, dancers, magicians, comedians and novelty performers — compete for a Royal Variety Performance slot and cash prize. Part of the global Got Talent franchise created by Simon Cowell."},{"t":"Britain's Next Top Model","y":"2005–2017","te":"UK","p":"Sky Living / Lifetime","g":"Talent Competition","s":"British adaptation of the Top Model format: aspiring British models compete through photo shoots, runway tasks and panel eliminations across 12 series, with a career-changing modelling contract as the prize."},{"t":"Britain's Worst Celebrity Driver","y":"2003","te":"UK","p":"Channel 5","g":"Celebrity Sports","s":"Celebrity spin-off of Britain's Worst Driver: famous faces with poor driving records took lessons and challenges in an attempt to improve — combining celebrity embarrassment with genuine road-safety content."},{"t":"Britain's Worst Driver","y":"2002–2003","te":"UK","p":"Channel 5","g":"Factual Entertainment","s":"Reality series in which nominated bad drivers undertook obstacle courses and professional assessments to identify and reform Britain's worst driver — a road-safety format with a strong comedy edge."},{"t":"Britney and Kevin: Chaotic","y":"2005","te":"USA","p":"UPN","g":"Celebrity Reality","s":"Reality series built from personal video footage shot by Britney Spears and Kevin Federline during their whirlwind relationship — a raw, intimate pop-star document unlike any conventional celebrity access format."},{"t":"Bromans","y":"2017","te":"UK","p":"ITV2","g":"Reality Competition","s":"British reality competition in which couples lived and competed in an authentic Roman-style setting with gladiator-inspired physical challenges and Roman social customs — a historical role-play meets couples competition format."},{"t":"Brynne: My Bedazzled Life","y":"2012–2014","te":"Australia","p":"Seven Network","g":"Celebrity Reality","s":"Australian series following socialite Brynne Edelsten through her glamorous and turbulent personal life — a celebrity lifestyle docu-reality built around a high-profile social figure."},{"t":"Bug Juice","y":"1998–2001; 2018","te":"USA","p":"Disney Channel","g":"Youth Reality","s":"Disney Channel observational reality series following children and teenagers through their summer camp experience — one of the first youth-targeted reality formats on American television."},{"t":"Busão do Brasil","y":"2010","te":"Brazil","p":"Band","g":"Reality Competition","s":"Brazilian reality format in which contestants lived and travelled together on a cross-country bus while facing public votes and elimination — a road-trip cohabitation game unique to Brazilian reality television."},{"t":"Canada's Next Top Model","y":"2006–2009","te":"Canada","p":"Citytv / CTV","g":"Talent Competition","s":"Canadian adaptation of the Top Model franchise — aspiring Canadian models competing in photo shoots, runway challenges and panel eliminations for a professional modelling contract."},{"t":"Canada's Worst Driver","y":"2005–2018","te":"Canada","p":"Discovery Channel Canada","g":"Factual Entertainment","s":"Canadian reality series running 14 seasons in which nominated poor drivers took intensive driver training and challenge courses — a durable road-safety-meets-entertainment format with one of the longest runs in Canadian reality television."},{"t":"Canadian Idol","y":"2003–2008","te":"Canada","p":"CTV","g":"Talent Competition","s":"Canadian adaptation of the Idol singing competition: auditions, live performances and viewer voting across six seasons, launching careers including Melissa O'Neil and Eva Avila."},{"t":"Candid Camera","y":"1948–present","te":"USA","p":"Multiple networks / syndication","g":"Prank / Hidden Camera","s":"One of the longest-running television formats in history: ordinary people are filmed reacting to staged comedic situations by a hidden camera — the original modern prank format, first broadcast in 1948."},{"t":"Cannonball Run 2001","y":"2001","te":"USA","p":"USA Network","g":"Reality Adventure","s":"Reality road-race programme based around a cross-country rally inspired by the legendary Cannonball Run concept — an early motoring-adventure format combining driving culture with competition."},{"t":"Capture (TV series)","y":"2013","te":"USA","p":"The CW","g":"Reality Adventure","s":"CW wilderness competition in which teams lived in a forested arena, pursuing or evading each other in a high-tech capture game — an early attempt to blend survival reality with a structured chase mechanic."},{"t":"Castaway 2000","y":"2000","te":"UK","p":"BBC One","g":"Social Experiment","s":"BBC social experiment in which 36 volunteers attempted to build a self-sufficient community on the Scottish island of Taransay for one full year — a pre-Big Brother landmark in British social experiment documentary."},{"t":"Caught on Camera with Nick Cannon","y":"2014–2016","te":"USA","p":"NBC","g":"Factual Entertainment","s":"NBC series hosted by Nick Cannon presenting dramatic, unusual and viral video footage — a clip-and-commentary format built on the growing culture of real-life camera footage."},{"t":"Celebrity Apprentice","y":"2008–2017","te":"USA","p":"NBC","g":"Reality Competition","s":"Celebrity version of The Apprentice: famous contestants completed business tasks to raise money for their chosen charities while facing boardroom elimination. Hosted by Donald Trump, then Arnold Schwarzenegger."},{"t":"Celebrity Bainisteoir","y":"2008–2012","te":"Ireland","p":"RTÉ One","g":"Celebrity Sports","s":"Irish format in which celebrities managed local Gaelic football teams in a real inter-county competition — combining the sports-management format with Irish cultural identity and community pride."},{"t":"Celebrity Big Brother (American TV series)","y":"2018–present","te":"USA","p":"CBS","g":"Reality Competition","s":"American celebrity edition of Big Brother: famous houseguests live under surveillance, compete in power competitions and vote each other out — CBS's summer companion to the civilian Big Brother franchise."},{"t":"Celebrity Big Brother (British TV series)","y":"2001–present","te":"UK","p":"Channel 4 / Channel 5 / ITV","g":"Reality Competition","s":"UK celebrity edition of Big Brother — with multiple stints on Channel 4 and Channel 5, and revived on ITV from 2024. One of British television's most consistently controversial and watched reality formats."},{"t":"Celebrity Farm","y":"2000s","te":"International","p":"Various","g":"Celebrity Reality","s":"International reality format placing celebrities on a working farm to live together, complete agricultural tasks and face eliminations — adapted across multiple territories as a celebrity version of the farm-life survival concept."},{"t":"Celebrity Fit Club","y":"2002–2010","te":"USA / UK","p":"VH1 / ITV","g":"Makeover Reality","s":"Reality series in which overweight celebrities worked with fitness trainers and medical experts to lose weight under public scrutiny — a transformation-accountability format adapted in the US and UK."},{"t":"Celebrity Love Island","y":"2005–2006","te":"UK","p":"ITV","g":"Celebrity Reality","s":"Early British format placing celebrities in a tropical location to form relationships under audience votes — a precursor concept to the modern Love Island franchise that later evolved into its civilian form."},{"t":"Celebrity Splash!","y":"2012–present","te":"Netherlands / International","p":"SBS6 (NL) + adaptations","g":"Celebrity Sports","s":"Dutch format in which celebrities learn and perform competitive high-diving routines for a panel of judges and public viewers — adapted internationally across Europe and beyond, with the Netherlands original launching on SBS6."},{"t":"Celebrity Wrestling","y":"2005","te":"UK","p":"ITV","g":"Celebrity Sports","s":"British series in which celebrities trained with professional wrestlers and competed in scripted-style bouts in a live arena — a short-lived but spectacular collision of celebrity and sports entertainment."},{"t":"Chains of Love (TV series)","y":"2001","te":"USA","p":"UPN","g":"Reality Dating","s":"Dating show in which a single contestant was literally chained to four potential partners for days and progressively unlocked and eliminated them — forced physical proximity as an extreme dating mechanic."},{"t":"Changing Rooms","y":"1996–2022","te":"UK","p":"BBC One / Channel 4","g":"Home Makeover","s":"Beloved British home makeover format in which neighbours swap houses and redecorate one room in each other's home with a designer's help — originally BBC One, revived on Channel 4 in 2021."},{"t":"Charm School (TV series)","y":"2007–2009","te":"USA","p":"VH1","g":"Behavioural Reality","s":"VH1 series in which contestants from other reality shows were sent to an etiquette and self-improvement school with weekly eliminations — a redemption-arc format built around previous reality personalities."},{"t":"Cheaters (American TV series)","y":"2000–present","te":"USA","p":"Syndication","g":"Factual Reality","s":"Long-running syndicated series investigating suspected infidelity and staging confrontations between partners and their suspected cheating companions — one of reality television's most provocative and persistent formats."},{"t":"Cheer Perfection","y":"2012–2013","te":"USA","p":"TLC","g":"Youth Reality","s":"TLC reality series following young competitive cheerleaders, their coaches and parents at an elite Arkansas cheer gym — combining athletic ambition with intense parental pressure."},{"t":"Chef School","y":"2007–2008","te":"Canada","p":"Food Network Canada","g":"Occupational Reality","s":"Canadian observational series following students at the prestigious Stratford Chefs School as they trained for professional culinary careers — an access documentary inside a real-world cooking institution."},{"t":"Chopped (TV series)","y":"2009–present","te":"USA","p":"Food Network","g":"Talent Competition","s":"Food Network's most durable cooking competition: chefs create dishes from surprise mystery baskets and are eliminated by a judging panel across multiple rounds. One of the most widely watched cooking formats in American television."},{"t":"Chrisley Knows Best","y":"2014–2023","te":"USA","p":"USA Network","g":"Family Docu-Reality","s":"Reality series following businessman Todd Chrisley and his outspoken family — a patriarch-led family comedy docu-reality that ran for 9 seasons before its cancellation following legal issues involving the Chrisley family."},{"t":"Christina Milian Turned Up","y":"2015–2016","te":"USA","p":"E!","g":"Celebrity Reality","s":"E! series following singer-actress Christina Milian as she navigated her music career comeback, family relationships and personal life — an aspirational celebrity docu-reality built around music industry hustle."},{"t":"Clean House","y":"2003–2011","te":"USA","p":"Style Network","g":"Home Makeover","s":"Style Network makeover series in which cluttered, disorganized homes were cleared, reorganized and redesigned by a team of experts — a decluttering-and-reveal format that ran for 10 seasons and helped define the home makeover genre."},{"t":"Coal House (TV series)","y":"2007","te":"UK","p":"BBC Wales","g":"Historical Reality","s":"Welsh living-history format in which modern families lived as Welsh coal-mining families would have in 1927 — a rigorous historical immersion experiment co-produced by BBC Wales."},{"t":"College Hill (TV series)","y":"2004–present","te":"USA","p":"BET","g":"Docu-soap","s":"BET reality series following college students living together while attending HBCUs — a group-house docu-soap centred on Black campus life, identity, friendships and conflicts. Revived in 2022."},{"t":"Cops (TV program)","y":"1989–present","te":"USA","p":"Fox / Spike / Paramount Network","g":"Occupational Reality","s":"One of reality television's oldest and most influential formats: cameras ride along with police officers through real arrests, domestic calls and incidents. Still airing in various forms after 35+ years."},{"t":"Crikey! It's the Irwins","y":"2018–present","te":"Australia / USA","p":"Animal Planet","g":"Animal / Nature","s":"Animal Planet series following the Irwin family — Terri, Bindi and Robert — at Australia Zoo and in global conservation work, continuing Steve Irwin's legacy through the next generation of wildlife advocates."},{"t":"Critical Rescue","y":"2003","te":"USA","p":"Discovery Channel","g":"Emergency / Medical Reality","s":"Short-run Discovery documentary series following emergency rescue workers responding to dangerous and time-critical incidents — an early entry in the emergency-services reality genre."},{"t":"Crowned: The Mother of All Pageants","y":"2007–2008","te":"USA","p":"The CW","g":"Reality Competition","s":"Beauty-pageant competition format in which mother-daughter teams competed in pageant-style challenges and eliminations — testing family teamwork and aspiration within the American pageant culture tradition."},{"t":"Daisy of Love","y":"2009","te":"USA","p":"VH1","g":"Reality Dating","s":"VH1 dating competition in which rock-glam personality Daisy de la Hoya — a breakout from Rock of Love — chose from a group of male suitors across an elimination series."},{"t":"Dallas Cowboys Cheerleaders: Making the Team","y":"2006–2021","te":"USA","p":"CMT","g":"Reality Competition","s":"Long-running series following the rigorous auditions, training camp and final selection process for the world-famous Dallas Cowboys Cheerleaders squad — one of CMT's most-watched unscripted formats across 16 seasons."},{"t":"Dance Moms","y":"2011–2019","te":"USA","p":"Lifetime","g":"Youth Reality","s":"Lifetime's defining reality series: young dancers at Abby Lee Miller's Pittsburgh dance studio face intense competitive pressure while their mothers clash with coaches and each other. Eight seasons and one of Lifetime's highest-rated formats."},{"t":"Dance Plus","y":"2015–present","te":"India","p":"Star Plus","g":"Talent Competition","s":"Indian dance competition series in which dancers and crews perform for celebrity mentors and judges across multiple seasons — one of India's most popular dance talent formats."},{"t":"Dancing on Ice","y":"2006–present","te":"UK","p":"ITV","g":"Celebrity Sports","s":"British celebrity ice-skating competition in which famous faces train with professional skating partners and perform weekly routines for judges and public votes — one of ITV's most durable entertainment format staples."},{"t":"Dancing with the Stars: Juniors","y":"2018","te":"USA","p":"ABC","g":"Youth Reality","s":"American spin-off of the ballroom celebrity format featuring child celebrities paired with junior professional dancers — a single-season experiment applying the Dancing with the Stars format to younger talent."},{"t":"Dancing with the Stars (American TV series)","y":"2005–present","te":"USA","p":"ABC / Disney+","g":"Talent / Entertainment","s":"The American adaptation of Strictly Come Dancing: celebrities paired with professional ballroom dancers compete in weekly live routines for judge scores and public votes. 33 seasons and consistently one of ABC's highest-rated entertainment formats."},{"t":"Dash Dolls","y":"2015","te":"USA","p":"E!","g":"Docu-soap","s":"E! reality series following employees of the Kardashian-affiliated DASH boutique in Los Angeles — a celebrity-adjacent workplace docu-soap capitalising on the Kardashian brand universe."},{"t":"Date My Mom","y":"2004–2006","te":"USA","p":"MTV","g":"Reality Dating","s":"MTV dating format in which a prospective dater went on individual dates with the mothers of three potential partners before choosing who to take on an actual date — using parental proxies to reveal romantic compatibility."},{"t":"Dating in the Dark","y":"2009–present","te":"Netherlands / International","p":"Various","g":"Social Experiment","s":"Dutch-originated dating format in which singles meet, converse and form emotional connections in complete darkness — only seeing each other for the first time at a key reveal moment. One of the Netherlands' most widely adapted dating format exports."},{"t":"David Tutera's CELEBrations","y":"2014–2016","te":"USA","p":"WE tv","g":"Factual Entertainment","s":"Series following celebrity event planner David Tutera as he designed and executed extraordinary celebrations for celebrity clients — an event-planning makeover format built on luxury and emotional transformation."},{"t":"De Mol (TV series)","y":"1998–present","te":"Belgium","p":"VRT / Play4","g":"Reality Competition","s":"Belgian original of the global Mole format: contestants travel together completing missions while one hidden mole secretly sabotages the group's prize fund. The Belgian original that inspired the global format licensing wave."},{"t":"De Verraders","y":"2021–present","te":"Netherlands","p":"RTL 4","g":"Reality Competition","s":"Dutch reality format — Faithful contestants try to identify the hidden Traitors secretly eliminating them at nightly roundtable meetings. The Dutch original that, alongside the Belgian De Mol, inspired the global Traitors format phenomenon."},{"t":"Deadliest Catch","y":"2005–present","te":"USA","p":"Discovery Channel","g":"Occupational Reality","s":"Discovery's landmark occupational reality series following crab-fishing crews working in the Bering Sea under extreme weather conditions — one of the genre's most critically respected and enduring workplace formats."},{"t":"Deadline (2007 TV series)","y":"2007","te":"UK","p":"ITV2","g":"Celebrity Reality","s":"British series in which celebrities worked under editorial pressure to produce a weekly magazine — an early experiment in applying real professional challenge to celebrity labour."},{"t":"Dealers (TV series)","y":"2000s","te":"UK","p":"Discovery Real Time","g":"Factual Entertainment","s":"British reality series following antiques dealers as they appraised, bought and sold collectibles — an early entry in the trading-and-valuation factual entertainment genre."},{"t":"Deliciousness (TV series)","y":"2020–2022","te":"USA","p":"MTV","g":"Clip Show","s":"MTV comedy clip show spin-off from Ridiculousness focused on food-related viral videos and commentary — a niche extension of the format-family targeting food culture and eating fails."},{"t":"Destroyed in Seconds","y":"2008–2009","te":"USA","p":"Discovery Channel","g":"Clip Show","s":"Discovery series showcasing sudden accidents, explosions and disasters captured on video — a compilation format built on the visceral spectacle of things being catastrophically destroyed in real life."},{"t":"Dismissed (American TV series)","y":"2001–2003","te":"USA","p":"MTV","g":"Reality Dating","s":"MTV dating format in which one person went on a simultaneous date with two competing contestants and dismissed one at the end of each episode — an early elimination-dating format built on direct romantic comparison."},{"t":"Dog Eat Dog (British game show)","y":"2001–2002","te":"UK","p":"BBC One","g":"Gameshow","s":"British game show in which contestants nominated each other for physical and mental challenges, with winners advancing and losers eliminated — a peer-selection stunt format that combined strategy with competitive humiliation."},{"t":"Dog Eat Dog (U.S. game show)","y":"2002–2003","te":"USA","p":"NBC","g":"Gameshow","s":"American adaptation of Dog Eat Dog: contestants competed in stunts and trivia challenges selected by fellow contestants — applying the peer-selection mechanic to American primetime."},{"t":"Dog Whisperer with Cesar Millan","y":"2004–2012","te":"USA","p":"National Geographic Channel","g":"Animal / Nature","s":"Long-running series following dog behaviour expert Cesar Millan as he worked with dog owners to address and rehabilitate problem behaviour — one of the most influential animal-expert reality formats in television history."},{"t":"Dog and Beth: On the Hunt","y":"2013–2015","te":"USA","p":"CMT","g":"Occupational Reality","s":"Reality series following Duane 'Dog' Chapman and Beth Chapman as they worked with bail-bond businesses and tracked fugitives — a continuatio r automotive obstacle course — a visually cinematic motorsport format."},{"t":"I'm Famous and Frightened!","y":"2004–2005","te":"UK","p":"Living TV","g":"Celebrity Reality","s":"British celebrity paranormal format in which famous participants spent time in allegedly haunted locations and completed fear-based tasks — part of the early 2000s UK celebrity paranormal reality wave."},{"t":"I'm a Celebrity...Get Me Out of Here!","y":"2002–present","te":"UK / International","p":"ITV + International","g":"Celebrity Reality","s":"ITV's iconic jungle celebrity survival format: celebrities live in a camp and complete fear-based trials voted on by the public, with weekly eliminations. One of ITV's biggest annual events; adapted internationally including Australia, Germany, South Africa and beyond."},{"t":"I Am Cait","y":"2015–2016","te":"USA","p":"E!","g":"Celebrity Reality","s":"E! documentary series following Caitlyn Jenner after her high-profile gender transition — a landmark celebrity access format that brought transgender identity and advocacy to mainstream American reality television."},{"t":"I Kissed a Boy (TV series)","y":"2023–present","te":"UK","p":"BBC Three / iPlayer","g":"Reality Dating","s":"BBC Three queer male dating format in which gay men are introduced with a kiss before exploring romantic compatibility — a bold, positive representation format for BBC's youth digital network."},{"t":"I Kissed a Girl (TV series)","y":"2024–present","te":"UK","p":"BBC Three / iPlayer","g":"Reality Dating","s":"BBC Three queer female companion format to I Kissed a Boy — women dating women after being paired and introduced with a kiss. Continues BBC Three's commitment to LGBTQ+ representation in dating reality."},{"t":"I Know My Kid's a Star","y":"2008","te":"USA","p":"VH1","g":"Youth Reality","s":"VH1 competition in which child performers and their parents competed for a talent-management prize — a format exploring stage ambition filtered through often extreme parental pressure. domesticity."},{"t":"Ice Road Truckers","y":"2007–2017","te":"USA / Canada","p":"History Channel","g":"Occupational Reality","s":"History Channel series following truck drivers hauling freight across frozen lakes and Arctic roads under extreme weather conditions — an occupational docu-reality built on genuine physical danger and logistics pressure."},{"t":"Idol (TV series)","y":"2001–present","te":"UK / International","p":"Multiple broadcasters","g":"Talent Competition","s":"The global Idol franchise originating from Pop Idol (UK, 2001): singers compete through regional auditions, live shows and public voting. One of the most globally adapted television formats in history — 50+ national versions."},{"t":"Idol Philippines","y":"2019; 2022","te":"Philippines","p":"ABS-CBN / TV5","g":"Talent Competition","s":"Philippine adaptation of the Idol franchise — singers competing through auditions and live performance rounds for public votes in one of Southeast Asia's most enthusiastic singing competition markets."},{"t":"Ilha Record","y":"2021–2022","te":"Brazil","p":"RecordTV","g":"Reality Competition","s":"Brazilian island survival reality show on RecordTV in which celebrities lived on an island and competed in challenges — RecordTV's answer to Survivor-style island competition."},{"t":"Indonesia's Next Top Model","y":"2020–present","te":"Indonesia","p":"NET / Various","g":"Talent Competition","s":"Indonesian adaptation of the Top Model franchise — aspiring models competing through photo shoots, runway challenges and elimination rounds for a professional contract."},{"t":"Indonesian Idol","y":"2004–present","te":"Indonesia","p":"RCTI","g":"Talent Competition","s":"Indonesian adaptation of the Idol singing competition — one of Southeast Asia's most popular talent formats with a massive national audience and multiple seasons."},{"t":"Infinite Challenge","y":"2005–2018","te":"South Korea","p":"MBC","g":"Variety Reality","s":"South Korean variety programme running 14 years in which cast members undertook comedic, physical and social challenges across constantly changing concepts — one of the most influential Korean variety formats and a direct precursor to modern K-variety formats."},{"t":"Ink Master","y":"2012–present","te":"USA","p":"Spike / Paramount Network","g":"Craft Competition","s":"Long-running tattoo artistry competition on Spike and Paramount Network in which tattoo artists complete technical and creative challenges on real clients, judged on skill, precision and artistry."},{"t":"Intervention (TV series)","y":"2005–present","te":"USA","p":"A&E","g":"Addiction Intervention","s":"A&E's landmark intervention documentary: following people with addictions and the families who love them, culminating in a formal intervention and offer of treatment. One of American television's most emotionally powerful documentary-reality formats."},{"t":"Invasion Iowa","y":"2005","te":"USA","p":"Spike TV","g":"Reality Hoax","s":"Spike TV series in which William Shatner and a team of actors staged a fake film production in Riverside, Iowa — a town-scale celebrity deception that turned an entire community into unknowing participants."},{"t":"It's Me or the Dog","y":"2005–2021","te":"UK / USA","p":"Channel 4 / Animal Planet","g":"Animal / Nature","s":"British series following dog trainer Victoria Stilwell as she helped owners correct difficult pet behaviour — a warm, practical animal-intervention format that ran for multiple series and an American spin-off on Animal Planet."},{"t":"Jamie's Kitchen","y":"2002","te":"UK","p":"Channel 4","g":"Food Activism","s":"Channel 4 documentary series following Jamie Oliver as he trained 15 unemployed young people at his new restaurant, Fifteen — a social mission through culinary skill-building that became one of Channel 4's most impactful factual formats."},{"t":"Jamie Oliver's Food Revolution","y":"2010–2011","te":"USA / UK","p":"ABC / Channel 4","g":"Food Activism","s":"Cross-Atlantic series following Jamie Oliver's campaign to improve school and community diets in the United States — a celebrity chef tackling institutional food culture in Huntington, West Virginia and Los Angeles."},{"t":"Jersey Shore (TV series)","y":"2009–2012","te":"USA","p":"MTV","g":"Youth Reality","s":"MTV's defining shared-house format: young Italian-American housemates in New Jersey, Miami and Italy party, fight and pursue romance. One of MTV's highest-rated formats and a cultural phenomenon that launched multiple spin-offs globally."},{"t":"Jerseylicious","y":"2010–2013","te":"USA","p":"Style Network","g":"Docu-soap","s":"Style Network docu-soap following the staff of New Jersey hair and beauty salons — a regional workplace reality built on big personalities, beauty culture and interpersonal drama."},{"t":"Jhalak Dikhhla Jaa","y":"2006–present","te":"India","p":"Sony / Colors TV","g":"Talent / Entertainment","s":"Indian adaptation of Dancing with the Stars — celebrities paired with professional choreographers for elaborate dance routines judged weekly by a panel. One of India's most popular and long-running celebrity dance competition formats."},{"t":"Jockeys (TV series)","y":"2009","te":"USA","p":"Animal Planet","g":"Occupational Reality","s":"Animal Planet series following professional horse-racing jockeys at tracks in Southern California — a sports docu-reality capturing the physical risk, competitive pressure and behind-the-scenes lives of elite flat-racing athletes."},{"t":"Big Brother (franchise)","y":"1999–present","te":"International","p":"Endemol / Banijay licensees","g":"Reality Competition","s":"The foundational social experiment reality format: strangers are isolated in a house under 24/7 camera surveillance, nominate each other for eviction and are voted out by the public. Created by John de Mol in the Netherlands in 1999 and now the most widely adapted social experiment format in television history — 50+ national versions across every inhabited continent."},{"t":"Road Rules","y":"1995–2007","te":"USA","p":"MTV","g":"Reality Adventure","s":"MTV's second reality show and a pioneer of travel-adventure reality television: five to six young strangers travel in an RV across countries with no money, completing missions and challenges at each stop. Created by Jonathan Murray and Mary-Ellis Bunim, it ran 14 seasons and generated The Challenge spin-off franchise."},{"t":"The Great Interior Design Challenge","y":"2014–2017","te":"UK","p":"BBC Two","g":"Craft Competition","s":"BBC Two competition searching for Britain's best amateur interior designers — contestants transform real rooms in clients' homes across four series, judged on creativity, practicality and design vision. Presented by Tom Dyckhoff; produced by Studio Lambert."},{"t":"Love Island (original)","y":"2015–present","te":"UK","p":"ITV2 / ITVX","g":"Reality Dating","s":"ITV2's flagship villa-dating competition: singles couple up in a sun-soaked location, recouple with new arrivals and are eliminated by public vote. The format that redefined British summer television and spawned global adaptations including Love Island USA, Australia, Germany, France, Sweden and beyond."},{"t":"The Circle (original)","y":"2018–present","te":"UK / International","p":"Channel 4 / Netflix","g":"Reality Competition","s":"Social media-themed reality competition in which contestants live in separate apartments in a building, communicating only through a bespoke social media platform and rating each other's profiles for popularity. Players can use their real identity or catfish as someone else. Created by Tim Harcourt for Channel 4; adapted internationally including the US (Netflix), France and Brazil."},{"t":"The Dead Files","y":"2011–2023","te":"USA","p":"Travel Channel","g":"Paranormal Reality","s":"Travel Channel paranormal investigation series in which physical medium Amy Allan and retired NYPD homicide detective Steve DiSchiavi conduct completely separate investigations of allegedly haunted locations — then meet
